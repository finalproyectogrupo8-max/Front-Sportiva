<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" fill="none" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#C87650" />
    </marker>
    <marker id="arrowBeige" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#D4BAA3" fill-opacity="0.7" />
    </marker>
    <radialGradient id="tacticalGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#C87650" stop-opacity="0.12" />
      <stop offset="80%" stop-color="#C87650" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#C87650" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background tint -->
  <rect width="1440" height="900" fill="url(#tacticalGrad)" />

  <!-- Tactical court half -->
  <rect x="220" y="100" width="1000" height="700" rx="12" stroke="#D4BAA3" stroke-width="1.5" stroke-opacity="0.25" fill="none" />
  <circle cx="720" cy="100" r="160" stroke="#C87650" stroke-width="1.5" stroke-opacity="0.3" fill="none" />
  <rect x="520" y="520" width="400" height="280" stroke="#D4BAA3" stroke-width="1.5" stroke-opacity="0.25" fill="none" />
  <path d="M520 520 A 200 200 0 0 1 920 520" stroke="#C87650" stroke-width="1.5" stroke-opacity="0.3" fill="none" />

  <!-- Playbook routes (dashed lines with arrows) -->
  <path d="M 380 700 Q 420 500 560 420" stroke="#C87650" stroke-width="2.5" stroke-dasharray="10 6" stroke-opacity="0.55" fill="none" marker-end="url(#arrow)" />
  <path d="M 1060 700 Q 1020 500 880 420" stroke="#C87650" stroke-width="2.5" stroke-dasharray="10 6" stroke-opacity="0.55" fill="none" marker-end="url(#arrow)" />
  <path d="M 720 280 Q 720 380 720 480" stroke="#D4BAA3" stroke-width="2" stroke-dasharray="8 6" stroke-opacity="0.45" fill="none" marker-end="url(#arrowBeige)" />
  <path d="M 580 400 Q 720 340 860 400" stroke="#C87650" stroke-width="2" stroke-dasharray="8 6" stroke-opacity="0.4" fill="none" marker-end="url(#arrow)" />

  <!-- Tactical Player Markers (X and O) -->
  <!-- Point guard -->
  <circle cx="720" cy="240" r="14" stroke="#C87650" stroke-width="2.5" stroke-opacity="0.7" fill="#10100F" />
  <text x="720" y="245" font-family="sans-serif" font-size="12" font-weight="bold" fill="#C87650" text-anchor="middle">1</text>

  <!-- Shooting guard & Small forward -->
  <circle cx="380" cy="730" r="14" stroke="#D4BAA3" stroke-width="2" stroke-opacity="0.6" fill="#10100F" />
  <text x="380" y="735" font-family="sans-serif" font-size="12" font-weight="bold" fill="#D4BAA3" text-anchor="middle">2</text>

  <circle cx="1060" cy="730" r="14" stroke="#D4BAA3" stroke-width="2" stroke-opacity="0.6" fill="#10100F" />
  <text x="1060" y="735" font-family="sans-serif" font-size="12" font-weight="bold" fill="#D4BAA3" text-anchor="middle">3</text>

  <!-- Power forward & Center -->
  <g stroke="#C87650" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6">
    <line x1="550" y1="410" x2="570" y2="430" />
    <line x1="570" y1="410" x2="550" y2="430" />
    <line x1="870" y1="410" x2="890" y2="430" />
    <line x1="890" y1="410" x2="870" y2="430" />
  </g>
</svg>

