<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" fill="none" width="100%" height="100%">
  <defs>
    <radialGradient id="adminGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#C87650" stop-opacity="0.14" />
      <stop offset="50%" stop-color="#C87650" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#C87650" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1440" height="900" fill="url(#adminGlow)" />

  <!-- Platform Infrastructure Node Matrix -->
  <g stroke="#D4BAA3" stroke-width="0.75" stroke-opacity="0.15">
    <!-- Concentric Central Nodes -->
    <circle cx="720" cy="400" r="320" stroke-dasharray="8 8" />
    <circle cx="720" cy="400" r="220" stroke="#C87650" stroke-width="1.2" stroke-opacity="0.25" stroke-dasharray="12 8" />
    <circle cx="720" cy="400" r="120" stroke-dasharray="6 6" />

    <!-- Central Hub Hexagon -->
    <polygon points="720,340 772,370 772,430 720,460 668,430 668,370"
      stroke="#C87650" stroke-width="2" stroke-opacity="0.6" fill="#C87650" fill-opacity="0.08" />
    <circle cx="720" cy="400" r="8" fill="#C87650" />

    <!-- Radiating connection lines to Tenant Clusters -->
    <line x1="720" y1="340" x2="720" y2="120" stroke="#C87650" stroke-width="1.5" stroke-opacity="0.4" />
    <line x1="772" y1="370" x2="1080" y2="240" stroke="#D4BAA3" stroke-width="1.5" stroke-opacity="0.3" />
    <line x1="772" y1="430" x2="1080" y2="560" stroke="#D4BAA3" stroke-width="1.5" stroke-opacity="0.3" />
    <line x1="720" y1="460" x2="720" y2="680" stroke="#C87650" stroke-width="1.5" stroke-opacity="0.4" />
    <line x1="668" y1="430" x2="360" y2="560" stroke="#D4BAA3" stroke-width="1.5" stroke-opacity="0.3" />
    <line x1="668" y1="370" x2="360" y2="240" stroke="#D4BAA3" stroke-width="1.5" stroke-opacity="0.3" />

    <!-- Peripheral Tenant Node Satellites -->
    <!-- Top Satellite (Club central) -->
    <circle cx="720" cy="120" r="28" stroke="#C87650" stroke-width="2" stroke-opacity="0.5" fill="none" />
    <circle cx="720" cy="120" r="4" fill="#C87650" />

    <!-- Top Right (Roster/Players) -->
    <circle cx="1080" cy="240" r="24" stroke="#D4BAA3" stroke-width="1.8" stroke-opacity="0.4" fill="none" />
    <circle cx="1080" cy="240" r="4" fill="#D4BAA3" />

    <!-- Bottom Right (Facilities/Canchas) -->
    <circle cx="1080" cy="560" r="24" stroke="#D4BAA3" stroke-width="1.8" stroke-opacity="0.4" fill="none" />
    <circle cx="1080" cy="560" r="4" fill="#D4BAA3" />

    <!-- Bottom Satellite (Inventory/Utilería) -->
    <circle cx="720" cy="680" r="28" stroke="#C87650" stroke-width="2" stroke-opacity="0.5" fill="none" />
    <circle cx="720" cy="680" r="4" fill="#C87650" />

    <!-- Bottom Left (Competition/Torneos) -->
    <circle cx="360" cy="560" r="24" stroke="#D4BAA3" stroke-width="1.8" stroke-opacity="0.4" fill="none" />
    <circle cx="360" cy="560" r="4" fill="#D4BAA3" />

    <!-- Top Left (Analytics/Telemetry) -->
    <circle cx="360" cy="240" r="24" stroke="#D4BAA3" stroke-width="1.8" stroke-opacity="0.4" fill="none" />
    <circle cx="360" cy="240" r="4" fill="#D4BAA3" />
  </g>
</svg>

