<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" fill="none" width="100%" height="100%">
  <defs>
    <radialGradient id="arenaGlow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#C87650" stop-opacity="0.18" />
      <stop offset="45%" stop-color="#C87650" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#C87650" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="podiumGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D4BAA3" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#C87650" stop-opacity="0.25" />
    </linearGradient>
  </defs>

  <rect width="1440" height="900" fill="url(#arenaGlow)" />

  <!-- Arena Spotlight Beams -->
  <polygon points="100,-50 300,900 450,900 200,-50" fill="#C87650" fill-opacity="0.03" />
  <polygon points="1340,-50 1140,900 990,900 1240,-50" fill="#C87650" fill-opacity="0.03" />
  <polygon points="720,-50 560,900 880,900 720,-50" fill="#D4BAA3" fill-opacity="0.02" />

  <!-- Tournament Bracket Tree (Left Side) -->
  <g stroke="#D4BAA3" stroke-width="1.5" stroke-opacity="0.25">
    <!-- Round 1 -->
    <path d="M 80 200 L 180 200 L 180 280 L 280 280" fill="none" />
    <path d="M 80 360 L 180 360 L 180 280" fill="none" />
    
    <path d="M 80 480 L 180 480 L 180 560 L 280 560" fill="none" />
    <path d="M 80 640 L 180 640 L 180 560" fill="none" />

    <!-- Semifinal -->
    <path d="M 280 280 L 360 280 L 360 420 L 460 420" stroke="#C87650" stroke-width="2" stroke-opacity="0.4" fill="none" />
    <path d="M 280 560 L 360 560 L 360 420" stroke="#C87650" stroke-width="2" stroke-opacity="0.4" fill="none" />

    <!-- Final indicator -->
    <line x1="460" y1="420" x2="540" y2="420" stroke="#C87650" stroke-width="2.5" stroke-opacity="0.6" />
    <circle cx="540" cy="420" r="5" fill="#C87650" />
  </g>

  <!-- Symmetric Bracket Tree (Right Side) -->
  <g stroke="#D4BAA3" stroke-width="1.5" stroke-opacity="0.25">
    <path d="M 1360 200 L 1260 200 L 1260 280 L 1160 280" fill="none" />
    <path d="M 1360 360 L 1260 360 L 1260 280" fill="none" />
    
    <path d="M 1360 480 L 1260 480 L 1260 560 L 1160 560" fill="none" />
    <path d="M 1360 640 L 1260 640 L 1260 560" fill="none" />

    <path d="M 1160 280 L 1080 280 L 1080 420 L 980 420" stroke="#C87650" stroke-width="2" stroke-opacity="0.4" fill="none" />
    <path d="M 1160 560 L 1080 560 L 1080 420" stroke="#C87650" stroke-width="2" stroke-opacity="0.4" fill="none" />

    <line x1="980" y1="420" x2="900" y2="420" stroke="#C87650" stroke-width="2.5" stroke-opacity="0.6" />
    <circle cx="900" cy="420" r="5" fill="#C87650" />
  </g>

  <!-- Stylized Championship Trophy / Cup Centerpiece -->
  <g transform="translate(720, 360)">
    <!-- Laurel Wreath -->
    <path d="M -90 -30 C -120 -80, -90 -140, -40 -160 C -60 -120, -50 -80, -30 -50" stroke="#C87650" stroke-width="2" stroke-opacity="0.4" fill="none" />
    <path d="M 90 -30 C 120 -80, 90 -140, 40 -160 C 60 -120, 50 -80, 30 -50" stroke="#C87650" stroke-width="2" stroke-opacity="0.4" fill="none" />

    <!-- Cup Body -->
    <path d="M -50 -130 L 50 -130 L 40 -40 C 35 10, -35 10, -40 -40 Z" stroke="#D4BAA3" stroke-width="2" stroke-opacity="0.45" fill="none" />
    <!-- Handles -->
    <path d="M -50 -110 C -80 -100, -75 -60, -42 -50" stroke="#C87650" stroke-width="2" stroke-opacity="0.4" fill="none" />
    <path d="M 50 -110 C 80 -100, 75 -60, 42 -50" stroke="#C87650" stroke-width="2" stroke-opacity="0.4" fill="none" />
    <!-- Stem and Base -->
    <line x1="0" y1="10" x2="0" y2="50" stroke="#D4BAA3" stroke-width="3" stroke-opacity="0.45" />
    <rect x="-35" y="50" width="70" height="20" rx="3" stroke="#C87650" stroke-width="2" stroke-opacity="0.5" fill="none" />
    <circle cx="0" cy="-60" r="16" stroke="#C87650" stroke-width="1.5" stroke-opacity="0.5" fill="none" />
  </g>

  <!-- Podium Base Geometry (Bottom Center) -->
  <g transform="translate(720, 680)">
    <!-- 2nd Place (Left) -->
    <rect x="-240" y="40" width="140" height="120" rx="6" stroke="#D4BAA3" stroke-width="1.5" stroke-opacity="0.25" fill="url(#podiumGrad)" />
    <!-- 1st Place (Center) -->
    <rect x="-80" y="-10" width="160" height="170" rx="6" stroke="#C87650" stroke-width="2" stroke-opacity="0.5" fill="url(#podiumGrad)" />
    <!-- 3rd Place (Right) -->
    <rect x="100" y="80" width="140" height="80" rx="6" stroke="#D4BAA3" stroke-width="1.5" stroke-opacity="0.2" fill="url(#podiumGrad)" />
  </g>
</svg>

