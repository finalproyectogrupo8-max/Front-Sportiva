<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none" width="100%" height="100%">
  <defs>
    <pattern id="stadiumLattice" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M30 0 L60 30 L30 60 L0 30 Z" stroke="#C87650" stroke-width="0.8" stroke-opacity="0.18" fill="none" />
      <circle cx="30" cy="30" r="1.5" fill="#D4BAA3" fill-opacity="0.3" />
      <line x1="0" y1="0" x2="60" y2="60" stroke="#D4BAA3" stroke-width="0.5" stroke-opacity="0.1" />
      <line x1="60" y1="0" x2="0" y2="60" stroke="#D4BAA3" stroke-width="0.5" stroke-opacity="0.1" />
    </pattern>
    <radialGradient id="meshVignette" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <mask id="meshMask">
      <rect width="1200" height="800" fill="url(#meshVignette)" />
    </mask>
  </defs>

  <rect width="1200" height="800" fill="url(#stadiumLattice)" mask="url(#meshMask)" />

  <!-- Diagonal dynamic sports beam lines -->
  <line x1="0" y1="200" x2="1200" y2="600" stroke="#C87650" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="12 12" />
  <line x1="0" y1="260" x2="1200" y2="660" stroke="#D4BAA3" stroke-width="1" stroke-opacity="0.12" stroke-dasharray="8 8" />
  <line x1="0" y1="140" x2="1200" y2="540" stroke="#D4BAA3" stroke-width="1" stroke-opacity="0.12" stroke-dasharray="8 8" />
</svg>

