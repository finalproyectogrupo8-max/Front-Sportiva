<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" fill="none" width="100%" height="100%">
  <defs>
    <!-- Sports Jersey Micro-Mesh Pattern -->
    <pattern id="jerseyKnit" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="2" fill="#D4BAA3" fill-opacity="0.12" />
      <circle cx="0" cy="0" r="2" fill="#D4BAA3" fill-opacity="0.12" />
      <circle cx="28" cy="0" r="2" fill="#D4BAA3" fill-opacity="0.12" />
      <circle cx="0" cy="28" r="2" fill="#D4BAA3" fill-opacity="0.12" />
      <circle cx="28" cy="28" r="2" fill="#D4BAA3" fill-opacity="0.12" />
      <path d="M 0 14 L 28 14" stroke="#C87650" stroke-width="0.5" stroke-opacity="0.08" />
      <path d="M 14 0 L 14 28" stroke="#C87650" stroke-width="0.5" stroke-opacity="0.08" />
    </pattern>
    <radialGradient id="textileGlow" cx="60%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#C87650" stop-opacity="0.16" />
      <stop offset="50%" stop-color="#C87650" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#C87650" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Glow -->
  <rect width="1440" height="900" fill="url(#textileGlow)" />
  <!-- Micro Mesh Background -->
  <rect width="1440" height="900" fill="url(#jerseyKnit)" />

  <!-- Dynamic Athletic Stripes (Across right & center) -->
  <g stroke="#C87650" stroke-width="1.5" stroke-opacity="0.25">
    <line x1="200" y1="0" x2="600" y2="900" stroke-dasharray="16 12" />
    <line x1="240" y1="0" x2="640" y2="900" stroke-width="3" stroke-opacity="0.35" />
    <line x1="260" y1="0" x2="660" y2="900" stroke-width="1" stroke-opacity="0.15" />
  </g>

  <!-- Stylized Kit / Jersey Blueprint Outline (Right side) -->
  <g transform="translate(1080, 420)">
    <!-- Collar & Neckline -->
    <path d="M -140 -260 L -60 -260 C -40 -220, 40 -220, 60 -260 L 140 -260 L 220 -150 L 170 -110 L 130 -160 L 130 240 L -130 240 L -130 -160 L -170 -110 L -220 -150 Z"
      stroke="#D4BAA3" stroke-width="2.5" stroke-opacity="0.35" fill="none" />
    
    <!-- Ribbed Collar Detail -->
    <path d="M -60 -260 C -40 -200, 40 -200, 60 -260" stroke="#C87650" stroke-width="2.5" stroke-opacity="0.6" fill="none" />
    <path d="M -50 -260 C -35 -215, 35 -215, 50 -260" stroke="#D4BAA3" stroke-width="1.5" stroke-opacity="0.4" fill="none" />

    <!-- Sleeve Trim Accents -->
    <line x1="170" y1="-110" x2="220" y2="-150" stroke="#C87650" stroke-width="3" stroke-opacity="0.6" />
    <line x1="-170" y1="-110" x2="-220" y2="-150" stroke="#C87650" stroke-width="3" stroke-opacity="0.6" />

    <!-- Classic Iconic Number 10 Watermark on Kit -->
    <text x="0" y="70" font-family="'Barlow Condensed', sans-serif" font-size="160" font-weight="900" fill="#C87650" fill-opacity="0.12" text-anchor="middle" letter-spacing="4">
      10
    </text>

    <!-- Hem detail -->
    <line x1="-130" y1="220" x2="130" y2="220" stroke="#D4BAA3" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="6 4" />
  </g>

  <!-- Tailoring & Measurement Marks (Left side) -->
  <g transform="translate(280, 480)" stroke="#D4BAA3" stroke-width="1.2" stroke-opacity="0.3">
    <!-- Measuring tape tape contour -->
    <rect x="-120" y="-80" width="240" height="160" rx="12" fill="none" stroke-dasharray="12 8" />
    <circle cx="-120" cy="-80" r="4" fill="#C87650" />
    <circle cx="120" cy="-80" r="4" fill="#C87650" />
    <circle cx="-120" cy="80" r="4" fill="#C87650" />
    <circle cx="120" cy="80" r="4" fill="#C87650" />
    <!-- Talle indicator -->
    <text x="0" y="10" font-family="'Barlow Condensed', sans-serif" font-size="32" font-weight="bold" fill="#D4BAA3" fill-opacity="0.3" text-anchor="middle">
      SIZE · M / L / XL
    </text>
  </g>
</svg>

