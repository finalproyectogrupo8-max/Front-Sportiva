name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Si llega un push nuevo al mismo PR, cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Mínimo privilegio: el workflow solo necesita leer el código.
permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      # Instala pnpm (versión de packageManager), Node 24 y las dependencias
      # con --frozen-lockfile: falla si pnpm-lock.yaml no coincide con package.json.
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Lint
        run: pnpm lint

      # Obligatorio: next.config.mjs ignora los errores de tipos en el build.
      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
